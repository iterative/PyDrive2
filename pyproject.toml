[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "PyDrive2"
description = "Google Drive API made easy. Maintained fork of PyDrive."
readme = "README.rst"
authors = [
    {name = "JunYoung Gwak", email = "jgwak@dreamylab.com"},
]
maintainers = [
    {name = "DVC team", email = "support@dvc.org"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=1.12.5",
    "google-auth>=2.15.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.5.0",
    "filelock>=3.30.0",
    "httplib2>=0.19.0",
    "oauthlib>=3.0.0",
    "PyYAML>=3.0",
    "cryptography>=3.4",
    "pywin32>=305; sys_platform == 'win32'",
]
license = {text = "Apache License 2.0"}
dynamic = ["version"]

[project.urls]
Documentation = "https://docs.iterative.ai/PyDrive2"
Source = "https://github.com/iterative/PyDrive2"
Changelog = "https://github.com/iterative/PyDrive2/releases"

[project.optional-dependencies]
fsspec = [
    "fsspec>=2021.07.0",
    "tqdm>=4.0.0",
    "funcy>=1.14",
    "appdirs>=1.4.3",
]
tests = [
    "pytest>=4.6.0",
    "timeout-decorator",
    "funcy>=1.14",
    "pytest-mock",
    "pyinstaller",
    "ruff==0.17.6",
]
typing = ["mypy==2.4.1", "types-httplib2", "types-PyYAML"]

[project.entry-points.pyinstaller40]
hook-dirs = "pydrive2.__pyinstaller:get_hook_dirs"
tests = "pydrive2.__pyinstaller:get_PyInstaller_tests"

[tool.setuptools]
packages=[
    "pydrive2",
    "pydrive2.test",
    "pydrive2.fs",
    "pydrive2.__pyinstaller",
]

[tool.setuptools_scm]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["E501", "I", "TC", "UP"]

[tool.ruff.lint.per-file-ignores]
# PyInstaller discovers hook modules by their hyphenated filenames.
"pydrive2/__pyinstaller/*-*.py" = ["N999"]

[tool.ruff.lint.pycodestyle]
max-line-length = 89

[tool.mypy]
python_version = "3.11"
files = ["pydrive2"]
exclude = ["/test(/|_)"]
check_untyped_defs = true
# Some runtime dependencies do not distribute type information.
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
markers = [
    "drive: requires Google Drive credentials",
    "manual: mark tests to be runnable only in local environment and require user manual actions.",
]

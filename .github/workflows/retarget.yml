name: Retest base branch change

on:
  pull_request:
    # Keep the same skipped check on a normal code update and a text edit.
    types: [opened, reopened, synchronize, edited]

jobs:
  retest:
    if: github.event.changes.base.ref.from
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/test.yml
    secrets:
      GDRIVE_USER_CREDENTIALS_DATA: ${{ secrets.GDRIVE_USER_CREDENTIALS_DATA }}

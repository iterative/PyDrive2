on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

name: Tests

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pyv: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.pyv }}

    - name: Install dependencies
      run: python -m pip install -e '.[fsspec, tests]'

    - name: Run offline tests
      run: python -m pytest -m "not manual and not drive"

    - name: Run live Drive tests
      if: >-
        github.actor != 'dependabot[bot]' &&
        !startsWith(github.head_ref || github.ref_name, 'dependabot/') &&
        ((github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]') ||
         ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref_type == 'branch'))
      run: python -m pytest -m "not manual and drive"
      env:
        GDRIVE_USER_CREDENTIALS_DATA: ${{ secrets.GDRIVE_USER_CREDENTIALS_DATA }}

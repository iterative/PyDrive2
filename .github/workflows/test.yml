on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      GDRIVE_USER_CREDENTIALS_DATA:
        required: false

name: Tests

permissions:
  contents: read

jobs:
  pending:
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
    permissions:
      statuses: write
    uses: ./.github/workflows/drive-status.yml
    with:
      # Retargeting keeps the head SHA. Bind that run to the new test merge commit.
      sha: &status-sha ${{ github.event.action == 'edited' && github.sha || github.event.pull_request.head.sha }}
      state: pending

  test:
    name: test (${{ matrix.os }}, ${{ matrix.pyv }})
    runs-on: ${{ matrix.os }}
    outputs:
      live: ${{ steps.live.outcome }}

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Put pyv before os so GitHub creates the Python 3.11 jobs for Ubuntu,
        # macOS, and Windows first. With three parallel slots, this lets us
        # catch platform-specific failures early.
        pyv: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.pyv }}

    - name: Check gdrive registration from the base wheel
      if: matrix.os == 'ubuntu-latest' && matrix.pyv == '3.11'
      run: |
        python -m venv "$RUNNER_TEMP/gdrive-base"
        py="$RUNNER_TEMP/gdrive-base/bin/python"
        "$py" -m pip install . fsspec gdrive-fsspec
        "$py" -I - <<'PY'
        import fsspec
        cls = fsspec.get_filesystem_class("gdrive")
        from pydrive2.fs import GDriveFileSystem
        assert cls is GDriveFileSystem
        PY

    - name: Install dependencies
      id: install
      run: python -m pip install -e '.[fsspec, tests]'

    - name: Run offline tests
      run: python -m pytest -m "not manual and not drive"

    - name: Run live Drive tests
      id: live
      # An offline failure still fails the job, but the live suite can run.
      if: >-
        !cancelled() && steps.install.outcome == 'success' &&
        github.actor != 'dependabot[bot]' &&
        !startsWith(github.head_ref || github.ref_name, 'dependabot/') &&
        ((github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]') ||
         ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref_type == 'branch'))
      run: python -m pytest -m "not manual and drive"
      env:
        GDRIVE_USER_CREDENTIALS_DATA: ${{ secrets.GDRIVE_USER_CREDENTIALS_DATA }}

  report:
    needs: [pending, test]
    if: always() && needs.pending.result == 'success'
    permissions:
      statuses: write
    uses: ./.github/workflows/drive-status.yml
    with:
      sha: *status-sha
      state: ${{ needs.test.result == 'success' && needs.test.outputs.live == 'success' && 'success' || 'failure' }}

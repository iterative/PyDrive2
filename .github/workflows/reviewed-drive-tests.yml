name: Reviewed PR Drive tests
run-name: "Drive tests for PR #${{ inputs.pr_number }} at ${{ inputs.head_sha }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number targeting main
        required: true
        type: number
      head_sha:
        description: Full 40-character head SHA reviewed for live Drive access
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    name: "Approve live tests for PR #${{ inputs.pr_number }} at ${{ inputs.head_sha }}"
    runs-on: ubuntu-latest
    environment:
      name: external
      url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}/commits/${{ inputs.head_sha }}
    steps:
      - name: Verify the approved revision is still the PR head
        id: reviewed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_SHA: ${{ inputs.head_sha }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Enter a positive PR number and its full lowercase head SHA."
            exit 1
          fi
          repository=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
            jq -er --arg sha "$REVIEWED_SHA" '
              select(.state == "open" and .base.ref == "main" and .head.sha == $sha)
              | .head.repo.full_name // empty
            ') || {
            echo "::error::Could not verify an open PR to main at the approved SHA."
            exit 1
          }
          printf 'repository=%s\n' "$repository" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.reviewed.outputs.repository }}
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -e '.[fsspec,tests]'

      - name: Run tests with Google Drive
        env:
          GDRIVE_USER_CREDENTIALS_DATA: ${{ secrets.GDRIVE_USER_CREDENTIALS_DATA }}
        run: python -m pytest -m "not manual"

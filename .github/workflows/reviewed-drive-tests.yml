name: Reviewed PR Drive tests
run-name: "Drive tests · #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

env:
  PR_NUMBER: ${{ github.event.issue.number }}

jobs:
  revision:
    if: >-
      github.event.issue.pull_request && github.event.issue.state == 'open' &&
      github.event.comment.body == '/test-drive'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      repository: ${{ steps.pr.outputs.repository }}
      external: ${{ steps.pr.outputs.external }}
    steps:
      - id: pr
        name: Identify the revision to review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
            jq -er 'select(.state == "open" and .base.ref == "main" and .head.repo != null)
              | "sha=\(.head.sha)", "repository=\(.head.repo.full_name)",
                "external=\(.head.repo.full_name != .base.repo.full_name or
                  .user.login == "dependabot[bot]" or (.head.ref | startswith("dependabot/")))"' >> "$GITHUB_OUTPUT"

  pending:
    needs: revision
    if: needs.revision.outputs.external == 'true'
    permissions:
      statuses: write
    uses: ./.github/workflows/drive-status.yml
    with:
      sha: ${{ needs.revision.outputs.sha }}
      state: pending

  test:
    needs: [revision, pending]
    name: "Live tests for PR #${{ github.event.issue.number }} at ${{ needs.revision.outputs.sha }}"
    runs-on: ubuntu-latest
    environment:
      name: external
      url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.issue.number }}/commits/${{ needs.revision.outputs.sha }}
    steps:
      - name: Verify the approved revision is still the PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ needs.revision.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
            jq -e --arg sha "$REVIEWED_SHA" '
              .state == "open" and .base.ref == "main" and .head.repo != null and .head.sha == $sha
            ' > /dev/null || { echo "::error::PR changed. Request /test-drive again."; exit 1; }

      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.revision.outputs.repository }}
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -e '.[fsspec,tests]'

      - name: Run tests with Google Drive
        env:
          GDRIVE_USER_CREDENTIALS_DATA: ${{ secrets.GDRIVE_USER_CREDENTIALS_DATA }}
        run: python -m pytest -m "not manual"

  report:
    needs: [revision, pending, test]
    if: always() && needs.pending.result == 'success'
    permissions:
      statuses: write
    uses: ./.github/workflows/drive-status.yml
    with:
      sha: ${{ needs.revision.outputs.sha }}
      state: ${{ needs.test.result == 'success' && 'success' || 'failure' }}
